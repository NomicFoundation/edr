name: Select node image
description: Resolves the node Docker image for a job, waiting (up to 15 minutes) for any in-flight mirror run first. Normal runs use the GHCR mirror (see mirror-docker-images.yml); release runs pull the official Docker Hub image directly, keeping the mirror out of the supply chain of published binaries.

inputs:
  tag:
    description: node image tag, e.g. 24-bookworm-slim or 22-alpine
    required: true
  is-release:
    description: check_commit's is_release output; 'true' marks a release run
    required: true

outputs:
  ref:
    description: Image reference to pull
    value: ${{ steps.select.outputs.ref }}

runs:
  using: composite
  steps:
    # Pulls can otherwise race ahead of the mirror run for the same commit
    # and fail with "manifest unknown". Best-effort: never fails the job.
    - name: Wait for in-flight mirror run
      if: inputs.is-release != 'true'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const { waitForMirrorRun } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/wait-for-mirror-run.ts`);
          await waitForMirrorRun({ github, context, core });

    - id: select
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        IS_RELEASE: ${{ inputs.is-release }}
      run: |
        if [ "$IS_RELEASE" = "true" ]; then
          echo "ref=node:${TAG}" >> "$GITHUB_OUTPUT"
        else
          echo "ref=ghcr.io/nomicfoundation/edr/mirror/node:${TAG}" >> "$GITHUB_OUTPUT"
        fi
