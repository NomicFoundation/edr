name: Hardhat 3 Regression Benchmark

# Benchmarks the *local* EDR build under test against Hardhat's E2E regression
# scenarios. Unlike Hardhat's own regression-benchmark (which uses whatever EDR
# is pinned on npm), this workflow builds EDR locally, publishes it to a local
# Verdaccio registry, repoints Hardhat's `@nomicfoundation/edr` dependency at
# it, builds Hardhat against that local EDR, and then runs Hardhat's
# `pnpm bench:regression --use-local`.
#
# Hardhat compat pin: when an EDR change breaks compatibility with current
# Hardhat main (so the baseline benchmark would fail until the matching
# Hardhat PR lands), the EDR PR can check in
# `.github/hardhat-compat-pin.json` referencing that Hardhat PR + a commit
# sha on it:
#
#   { "pr": <Hardhat PR number>, "sha": "<full commit sha>", "reason": "..." }
#
# Runs that would default to Hardhat `main` (push baselines, and
# dispatch/`/bench` runs without an explicit hardhat-ref) then benchmark
# against the pinned sha while the Hardhat PR is open, and revert to `main`
# automatically once it's merged. Delete the pin file after the merge. See
# `.github/scripts/resolve-regression-trigger.ts` for details. PRs that touch
# the pin file get it validated by `validate-hardhat-compat-pin.yml`.

on:
  # Records baselines for main.
  push:
    branches:
      - "main"
  # Manual runs, optionally against a specific Hardhat ref.
  workflow_dispatch:
    inputs:
      hardhat-ref:
        description: "The branch, tag or SHA of Hardhat to benchmark against. Empty defaults to `main`, or to the compat pin (`.github/hardhat-compat-pin.json`) if one is active."
        required: false
        type: string
      scenario-filter:
        description: "Glob(s) selecting which projects/scenarios to run, by directory name (e.g. `1inch*`). Comma-separated. Defaults to `*` (all projects). Forwarded to `bench:regression --scenarios`."
        required: false
        type: string
        default: "*"
      benchmark-filter:
        description: "Glob(s) selecting which benchmarks to run within each project, by name — a command or step name, i.e. the part after `<project> /` in a report (e.g. `test solidity`, `cold compile`, `*compile*`). Comma-separated. Defaults to `test solidity,test mocha,test vitest` (EDR affects test execution, not compilation); pass `*` to run the full suite. Forwarded to `bench:regression --benchmarks`."
        required: false
        type: string
        default: "test solidity,test mocha,test vitest"
  # ChatOps: comment `/bench` on a same-repo PR, optionally with
  # `hardhat-ref=<branch|sha|PR>` (defaults to `main`, or the compat pin if
  # one is active on the PR head), `scenarios="<glob>[,<glob>...]"` and/or
  # `benchmarks="<glob>[,<glob>...]"` to select which projects/benchmarks run
  # (quote values containing spaces). Authorization + gating happens in `setup`.
  issue_comment:
    types: [created]

concurrency:
  # Group by PR (comment events) or ref (dispatch) so re-triggering `/bench`
  # on a PR supersedes the previous run.
  #
  # Pushes to main are the exception: every commit must record its own baseline
  # entry, so each push gets a group keyed by commit SHA. `cancel-in-progress`
  # only protects the *in-progress* run, not runs *waiting* in the queue. A
  # unique-per-commit group collides with nothing, so every commit's run is
  # preserved and serialized by the self-hosted runner.
  #
  # Every comment triggers a workflow run. The job-level `if` skips non-`/bench`
  # ones, but that runs after concurrency is evaluated, so an unrelated comment
  # can cancel an in-progress benchmark. Give those skipped runs a unique group
  # so they collide with nothing.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.event.issue.number || github.ref }}${{ (github.event_name == 'issue_comment' && !startsWith(github.event.comment.body, '/bench')) && format('-skip-{0}', github.run_id) || '' }}
  # Don't cancel in-progress baseline runs on main so baselines aren't lost.
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  # EDR reports unexpected failures through `log`, which reaches the subscriber
  # only when a filter admits it.
  RUST_LOG: error

jobs:
  setup:
    name: Resolve refs and authorize
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read # read PR head / checkout metadata
      pull-requests: write # pulls.get + post status comments/reactions on the PR
      issues: write # post status comments + reactions on the PR
      actions: read # list EDR CI workflow runs for the CI-green gate
    # For comment events, only proceed for `/bench` comments on a PR. Other
    # events (push/workflow_dispatch) always evaluate inside the script.
    if: >-
      github.event_name != 'issue_comment' || (github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/bench'))

    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      edr_ref: ${{ steps.resolve.outputs.edr_ref }}
      hardhat_ref: ${{ steps.resolve.outputs.hardhat_ref }}
      is_baseline: ${{ steps.resolve.outputs.is_baseline }}
      scenario_filter: ${{ steps.resolve.outputs.scenario_filter }}
      benchmark_filter: ${{ steps.resolve.outputs.benchmark_filter }}
    steps:
      # Sparse-checkout only the workflow scripts so the github-script step can
      # require the resolver module below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { resolveRegressionTrigger } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/resolve-regression-trigger.ts`);
            await resolveRegressionTrigger({ github, context, core });

  regression-benchmark:
    name: Regression benchmark
    needs: setup
    if: needs.setup.outputs.should_run == 'true'
    environment: github-action-benchmark
    # Use Hardhat's dedicated self-hosted runner for stable measurements that
    # are comparable to Hardhat's own regression baselines.
    runs-on: hardhat-linux-amd64-self-hosted
    timeout-minutes: 180
    permissions:
      # Lets the GITHUB_TOKEN used by "Compare benchmark result against
      # baseline" read commit metadata via the REST API. Only needed on
      # dispatch and `/bench` runs; push events carry the commit in the
      # event payload.
      contents: read
    env:
      # Hardhat is checked out into ./hardhat; the EDR repo is the workspace root.
      HH: ${{ github.workspace }}/hardhat
    steps:
      - name: Checkout EDR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.edr_ref }}
          persist-credentials: false

      - name: Checkout Hardhat
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NomicFoundation/hardhat
          ref: ${{ needs.setup.outputs.hardhat_ref }}
          path: hardhat
          # `sinceReleasePublish` needs the full history + release tags to
          # decide which workspace packages to (re)publish.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # cspell:disable-next-line
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall

      - uses: ./.github/actions/setup-node
        with:
          # Match Hardhat main's expected Node version.
          node-version: "24"
      - uses: ./.github/actions/setup-rust

      - name: Install system dependencies
        # `time` is GNU /usr/bin/time — bench:regression wraps each benchmark in
        # it to capture peak RSS (memory) alongside timing.
        run: |
          sudo apt-get update
          sudo apt-get install -y hyperfine jq time

      - name: Configure E2E clone directory
        # Use the runner's temp dir for the scenario clones.
        run: echo "E2E_CLONE_DIR=${RUNNER_TEMP:?}/edr-e2e-clones" >> "$GITHUB_ENV"

      - name: Configure per-run package-manager caches
        # The benchmark republishes deterministic versions (e.g. hardhat@3.12.1)
        # whose content changes each run (new @nomicfoundation/edr pin), so any
        # package-manager cache that persists on the self-hosted runner can
        # resolve a prior run's stale republish. Point these caches at temp dirs
        # that are cleaned up at the end of the job (see "Clean up temp dir").
        #
        # Yarn berry: the global folder holds both the zip cache and the npm
        # packument metadata cache. YARN_* env vars override any .yarnrc.yml.
        #
        # Yarn classic: no override is needed. It doesn't have a persistent
        # metadata cache, and its tarball cache slug includes the tarball's
        # sha1.
        #
        # All caches live under PACKAGE_MANAGER_CACHES so the cleanup step can
        # remove that single directory without being updated for every cache
        # added here.
        run: |
          set -euo pipefail
          PACKAGE_MANAGER_CACHES="${RUNNER_TEMP:?}/package-manager-caches"
          {
            echo "PACKAGE_MANAGER_CACHES=$PACKAGE_MANAGER_CACHES"
            echo "BUN_INSTALL_CACHE_DIR=$PACKAGE_MANAGER_CACHES/bun-install"
            echo "YARN_GLOBAL_FOLDER=$PACKAGE_MANAGER_CACHES/yarn-global"
          } >> "$GITHUB_ENV"

      - name: Compute sentinel versions
        # Writes EDR_VER and HH_VER to $GITHUB_ENV
        env:
          EDR_REF: ${{ needs.setup.outputs.edr_ref }}
        run: node .github/scripts/compute-sentinel-versions.ts

      - name: Install EDR dependencies
        run: sfw pnpm install --frozen-lockfile --prefer-offline

      - name: Build EDR
        working-directory: crates/edr_napi
        run: pnpm build

      - name: Install Hardhat dependencies
        working-directory: hardhat
        run: sfw pnpm install --frozen-lockfile --prefer-offline

      - name: Start Verdaccio
        # Needs the preceding install: `verdaccio` is a devDependency of the
        # Hardhat workspace.
        working-directory: hardhat
        run: pnpm verdaccio start --background

      - name: Clear stale pnpm metadata cache
        # The self-hosted runner reuses ~/.cache/pnpm across runs. This job
        # publishes deterministic versions whose content changes each run (the
        # EDR sentinel, the benchmark's hardhat republishes). A stale packument
        # makes `pnpm publish` skip ("already exists") and installs resolve a
        # stale dependency. Run before anything publishes to or resolves from
        # Verdaccio.
        #
        # pnpm 11 ignores `npm_config_cache_dir`, so the metadata cache can't be
        # relocated.
        #
        # The content-addressable store is separate and kept on purpose: it's
        # keyed by integrity hash, so with fresh metadata pnpm derives the correct
        # hash and any stale entry is simply never matched. Keeping it is safe and
        # preserves install speed.
        run: rm -rf "$HOME/.cache/pnpm"

      - name: Publish local EDR to Verdaccio
        # Reuses Hardhat's pre-seeded Verdaccio auth.
        run: |
          bash ./scripts/publish_to_verdaccio.sh \
            --version "$EDR_VER" \
            --registry http://127.0.0.1:4873/ \
            --npmrc "$HH/.verdaccio/.npmrc"

      - name: Repoint Hardhat at the local EDR build
        working-directory: hardhat
        # Repoint the EDR dependency and point the @nomicfoundation scope at
        # Verdaccio, where the sentinel lives. Also bump hardhat's own version
        # so `decidePublishAction` returns "publish" instead of "skip".
        # Without the bump, `--use-local` would not republish hardhat right
        # after a Hardhat release.
        #
        # The override is scoped: install-wide, pnpm's whole-lockfile
        # `minimumReleaseAge` verification would route through Verdaccio's
        # uplink. It is also persistent, so later pnpm invocations can still
        # resolve the localhost-only sentinel.
        run: |
          set -euo pipefail
          npm pkg set "dependencies.@nomicfoundation/edr=$EDR_VER" --prefix packages/hardhat
          npm pkg set version="$HH_VER" --prefix packages/hardhat
          echo "@nomicfoundation:registry=http://127.0.0.1:4873/" >> .npmrc

      - name: Reinstall Hardhat dependencies against the local EDR build
        working-directory: hardhat
        # Re-sync the repoint-desynced lockfile; only the EDR packages move.
        # The `pnpm build` below then compiles against the local EDR's
        # typings. The checks fail fast on a broken install, which would
        # otherwise surface as a confusing tsc error or as a napi load error
        # deep in the benchmark.
        #
        # Not sfw-wrapped: a firewall proxy could intercept the loopback
        # registry. The only new packages come from that registry, so there
        # is nothing for Socket to scan anyway.
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          resolved=$(node -p 'require("./packages/hardhat/node_modules/@nomicfoundation/edr/package.json").version' 2>/dev/null || echo missing)
          if [ "$resolved" != "$EDR_VER" ]; then
            echo "::error::packages/hardhat resolves @nomicfoundation/edr@$resolved, expected $EDR_VER"
            exit 1
          fi
          # The native binding is an optionalDependency; verify it loads.
          (cd packages/hardhat && node -e 'require("@nomicfoundation/edr")')
          # Surface any lockfile drift for post-hoc comparison.
          git --no-pager diff -- pnpm-lock.yaml

      - name: Build Hardhat
        working-directory: hardhat
        run: |
          pnpm build
          # pnpm 11 skips creating bin symlinks whose target isn't built at
          # install time; relink now that build output exists. See pnpm/pnpm#10524.
          pnpm rebuild -r

      - name: Run regression benchmark
        working-directory: hardhat
        env:
          ALCHEMY_URL: ${{ secrets.ALCHEMY_URL }}
          # Scenario/benchmark glob filters, always set by the setup job (`*`
          # matches all). Forwarded verbatim to bench:regression, which matches
          # them against scenario directory / benchmark (command or step) names.
          SCENARIO_FILTER: ${{ needs.setup.outputs.scenario_filter }}
          BENCHMARK_FILTER: ${{ needs.setup.outputs.benchmark_filter }}
        # --force-publish: reuse our already-running Verdaccio (instead of
        #   erroring) and run the global sinceReleasePublish once up front.
        # --use-local: republish the (repointed) hardhat workspace packages and
        #   pin each scenario's hardhat/@nomicfoundation deps to Verdaccio.
        # --scenarios / --benchmarks: always passed; `*` means "all".
        run: |
          set -euo pipefail
          pnpm bench:regression \
            --use-local \
            --force-publish \
            --force-checkout \
            --e2e-clone-dir "$E2E_CLONE_DIR" \
            --output regression-report.json \
            --scenarios "$SCENARIO_FILTER" \
            --benchmarks "$BENCHMARK_FILTER"

      - name: Validate scenarios used the local EDR build
        working-directory: hardhat
        run: |
          set -euo pipefail

          echo "== Check A: published hardhat carries the local EDR =="
          MANIFEST=$(curl -sf http://127.0.0.1:4873/hardhat)
          LATEST=$(echo "$MANIFEST" | jq -r '."dist-tags".latest')
          EDR_DEP=$(echo "$MANIFEST" | jq -r --arg v "$LATEST" \
            '.versions[$v].dependencies["@nomicfoundation/edr"] // empty')
          echo "hardhat dist-tags.latest=$LATEST (expected $HH_VER)"
          echo "  -> @nomicfoundation/edr=$EDR_DEP (expected $EDR_VER)"
          if [ "$LATEST" != "$HH_VER" ]; then
            echo "::error::Published hardhat latest ($LATEST) != $HH_VER"
            exit 1
          fi
          if [ "$EDR_DEP" != "$EDR_VER" ]; then
            echo "::error::Published hardhat depends on EDR $EDR_DEP, expected $EDR_VER"
            exit 1
          fi

          echo "== Check B: each scenario's hardhat resolves the local EDR build =="
          found=0
          fail=0
          for d in "$E2E_CLONE_DIR"/*/; do
            [ -d "$d" ] || continue
            id=$(basename "$d")

            # Resolve the EDR that THIS scenario's hardhat loads. Works across
            # npm/pnpm/yarn node_modules layouts (Node realpaths pnpm symlinks).
            # Nested EDR copies pulled by other dependents (e.g. @1inch/solidity-utils,
            # hardhat-network-helpers) are intentionally ignored — only hardhat's
            # EDR (the build under test) matters for the benchmark.
            read -r hh_ver edr_ver < <(node -e '
              const fs = require("node:fs");
              const path = require("node:path");
              const dir = process.argv[1];
              // Resolve a package via its "." export (defined), then walk up to
              // its package.json. require.resolve("<pkg>/package.json") is blocked
              // by EDR/Hardhat exports maps, so we cannot ask for it directly.
              function pkgJsonPath(name, fromDir) {
                const main = require.resolve(name, { paths: [fromDir] });
                let d = path.dirname(main);
                for (;;) {
                  const cand = path.join(d, "package.json");
                  if (fs.existsSync(cand)) {
                    try { if (JSON.parse(fs.readFileSync(cand, "utf8")).name === name) return cand; } catch {}
                  }
                  const parent = path.dirname(d);
                  if (parent === d) throw new Error("package.json for " + name + " not found above " + main);
                  d = parent;
                }
              }
              try {
                const hhPkg = pkgJsonPath("hardhat", dir);
                const edrPkg = pkgJsonPath("@nomicfoundation/edr", path.dirname(hhPkg));
                const ver = (p) => JSON.parse(fs.readFileSync(p, "utf8")).version;
                process.stdout.write(ver(hhPkg) + " " + ver(edrPkg));
              } catch (e) { process.stderr.write(String(e.message || e)); }
            ' "$d" 2>/tmp/edr-resolve-err)  || true

            if [ -z "${edr_ver:-}" ]; then
              # yarn Plug'n'Play scenarios have no node_modules to resolve through.
              if { [ -f "$d/.pnp.cjs" ] || [ -f "$d/.pnp.loader.mjs" ]; } \
                   && grep -rqs -- "$EDR_VER" "$d/yarn.lock"; then
                found=1
                echo "OK (PnP lockfile): $id"
                continue
              fi
              echo "::error::$id: could not resolve hardhat's @nomicfoundation/edr ($(cat /tmp/edr-resolve-err))"
              fail=1
              continue
            fi

            found=1
            if [ "$edr_ver" != "$EDR_VER" ]; then
              echo "::error::$id: hardhat@$hh_ver resolves @nomicfoundation/edr@$edr_ver, expected $EDR_VER"
              fail=1
            else
              echo "OK: $id -> hardhat@$hh_ver, @nomicfoundation/edr@$edr_ver"
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "::error::No scenario resolved @nomicfoundation/edr via hardhat — local EDR was NOT used"
            exit 1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "All scenarios resolve the local EDR build ($EDR_VER) through hardhat."

      # Persist the (possibly partial) benchmark output in the job log so it
      # survives the runner's temp-dir cleanup and is available for debugging.
      - name: Dump regression report on failure
        if: failure()
        working-directory: hardhat
        run: |
          echo "== regression-report.json =="
          jq . regression-report.json 2>/dev/null \
            || cat regression-report.json 2>/dev/null \
            || echo "(no regression-report.json produced)"

      # Comparing and recording are split so that a regression can be told
      # apart from a failed write. This invocation only reads, so it cannot
      # fail the way "Record baseline in the results repo" can.
      #
      # It can still fail on a fetch or clone error instead of on the alert.
      # Nothing here distinguishes the two, so the Slack message calls both a
      # regression. The step's error annotation on the run says which it was.
      #
      # The comparison is against the last recorded data point, i.e. the
      # previous push to main. So the baseline moves: a regression alerts
      # once, then becomes the new normal.
      - name: Compare benchmark result against baseline
        id: compare
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        # A regression must not break main, so absorb the alert on baseline
        # runs and let the Slack step report it instead. Comparison runs
        # (`/bench`, dispatch) still fail.
        continue-on-error: ${{ needs.setup.outputs.is_baseline == 'true' }}
        with:
          tool: customSmallerIsBetter
          output-file-path: hardhat/regression-report.json
          gh-repository: github.com/nomic-foundation-automation/edr-benchmark-results
          gh-pages-branch: main
          benchmark-data-dir-path: hardhat3
          # This invocation only reads the (public) results repo, so the
          # short-lived GITHUB_TOKEN suffices on every trigger. A token is
          # still required: with `gh-repository` set, the action rejects an
          # empty `github-token` during config validation.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          alert-threshold: "110%"
          fail-on-alert: true
          summary-always: true

      - name: Clear the results-repo clone
        # "Compare benchmark result against baseline" leaves its clone of the
        # results repo in the workspace, and `git clone` refuses a non-empty
        # destination, so remove it before "Record baseline in the results
        # repo" clones again. `always()` because a comparison run that
        # fails on a regression has to clean up too.
        if: always()
        run: rm -rf "${GITHUB_WORKSPACE:?}/benchmark-data-repository"

      # Record the data point whether or not it regressed, so main's baseline
      # always tracks the newest commit. `fail-on-alert` is off here, so the
      # only way this fails is a genuine store failure (clone, auth or push
      # error) — which fails the run and gets the generic Slack notification
      # rather than the regression one.
      - name: Record baseline in the results repo
        id: record
        if: ${{ needs.setup.outputs.is_baseline == 'true' }}
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        # `tool` through `benchmark-data-dir-path` must stay identical to
        # "Compare benchmark result against baseline" — the two invocations
        # have to address the same dataset.
        with:
          tool: customSmallerIsBetter
          output-file-path: hardhat/regression-report.json
          gh-repository: github.com/nomic-foundation-automation/edr-benchmark-results
          gh-pages-branch: main
          benchmark-data-dir-path: hardhat3
          # Pushing to another repository needs the cross-repo PAT.
          github-token: ${{ secrets.BENCHMARK_GITHUB_TOKEN }}
          auto-push: true
          fail-on-alert: false
          # The comparison above already wrote the summary.
          summary-always: false

      - name: Notify failures and regressions
        # Fires on baseline runs for a failed run, or for a regression that
        # `continue-on-error` deliberately left green.
        #
        # Two details in the condition that look removable but are not:
        # 1. `failure()` suppresses the implicit `success()` that GitHub wraps
        #    every step `if:` in. Without it, this step is skipped on the
        #    failed runs it exists to report.
        # 2. It reads `outcome`, not `conclusion`, because `continue-on-error`
        #    rewrites `conclusion` to `success`.
        #
        # The regression wording needs the record step to have succeeded too.
        # An infra error that trips both steps therefore reads as a plain
        # failure.
        if: ${{ needs.setup.outputs.is_baseline == 'true' && (failure() || steps.compare.outcome == 'failure') }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.GH_ACTION_NOTIFICATIONS_SLACK_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          # Slack is the only channel a regression is reported on, so a
          # rejected delivery must fail the step rather than just warn — even
          # though on the green regression path that reddens the run.
          errors: true
          payload: |
            {
              "workflow_name": "${{ github.workflow }}${{ (steps.compare.outcome == 'failure' && steps.record.outcome == 'success') && ' — perf regression on main (baseline updated)' || '' }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

      - name: Clean up temp dir
        # Self-hosted runners don't automatically wipe RUNNER_TEMP between jobs, so we do
        # this manually to avoid polluting future runs.
        if: always()
        run: rm -rf "$E2E_CLONE_DIR" "$PACKAGE_MANAGER_CACHES"

  report:
    name: Report result to PR
    needs: [setup, regression-benchmark]
    # 1. run on benchmark failure but skip when the run is superseded (concurrency)
    # 2. Only report back to the PR for `/bench` comment triggers
    # 3. Only report back if the benchmark actually started
    # prettier-ignore
    if: >-
      !cancelled()
        && github.event_name == 'issue_comment'
        && needs.regression-benchmark.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      issues: write # post the result comment on the PR
      pull-requests: write # post status comments/reactions on the PR
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULT: ${{ needs.regression-benchmark.result }}
          EDR_REF: ${{ needs.setup.outputs.edr_ref }}
          HARDHAT_REF: ${{ needs.setup.outputs.hardhat_ref }}
        with:
          script: |
            const { RESULT, EDR_REF, HARDHAT_REF } = process.env;
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            const target =
              `\`${EDR_REF.slice(0, 12)}\` against Hardhat \`${HARDHAT_REF}\``;
            const body =
              RESULT === "success"
                ? `✅ Regression benchmark passed for ${target}.\n\n` +
                  `[View workflow run](${runUrl})`
                : `❌ Regression benchmark failed for ${target}. This is either ` +
                  `a detected performance regression or an infrastructure ` +
                  `failure — see the run for details.\n\n` +
                  `[View workflow run](${runUrl})`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body,
            });
