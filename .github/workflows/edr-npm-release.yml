# Thin release pipeline: detects (pre-)release commits, runs the reusable
# build workflow (edr-npm-build.yml) in release mode, and publishes to npm.
# Non-release pushes skip everything after check_commit; PR/branch validation
# lives in edr-npm-ci.yml.
name: EDR NPM release
permissions: {}
on:
  push:
    # pre-releases will be triggered in any of these branches
    # production releases will only be triggered for `main`
    # (keep branches and paths in sync with edr-npm-ci.yml, which skips
    # release pushes so each push runs exactly one of the two workflows)
    branches:
      - main
      - prerelease
      - hh2
      - feat/solidity-tests
    tags-ignore:
      - "**"
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - "**/*.gitignore"
      - .editorconfig
      - docs/**
  # Release rehearsal: forces the release path on any commit — cold build,
  # official Docker Hub images, cooldown check, environment approval — but
  # publishes with --dry-run. Real publishes happen only on push events.
  workflow_dispatch:

jobs:
  check_commit:
    name: Check commit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - id: check
        uses: ./.github/actions/check-release-commit

    outputs:
      # workflow_dispatch is a rehearsal: force the release path with 'next'
      # as a placeholder dist-tag (publish adds --dry-run, so it's never used).
      tag: ${{ steps.check.outputs.tag || (github.event_name == 'workflow_dispatch' && 'next') || '' }}
      is_release: ${{ steps.check.outputs.is-release == 'true' || github.event_name == 'workflow_dispatch' }}

  # The single release/non-release condition in this workflow: every other
  # job hangs off this one via `needs`, so a non-release push skips the whole
  # tree and nothing else needs a guard.
  release_gate:
    name: Release gate
    runs-on: ubuntu-24.04
    needs: check_commit
    if: needs.check_commit.outputs.is_release == 'true'
    steps:
      - name: Confirm release run
        env:
          TAG: ${{ needs.check_commit.outputs.tag }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "Release run confirmed (dist-tag $TAG, dry-run $DRY_RUN)"

  build:
    name: Build and test
    needs: release_gate
    uses: ./.github/workflows/edr-npm-build.yml
    with:
      release: true
    permissions:
      contents: read
      packages: read
      actions: read # select-node-image lists mirror workflow runs

  # Extra-defensive cooldown check: `main` branch and PRs already require passing this in CI,
  # but we re-check here to guarantee we never release with too-fresh dependencies.
  cooldown-check:
    name: Cargo cooldown check
    runs-on: ubuntu-24.04
    needs: release_gate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust

      - uses: NomicFoundation/cargo-cooldown-check@0e9231d9dc6084e8ed2e2eee2fa812f27776cab8 # v0.2.0

  notify-deploy:
    name: Notify pre-deploy to Slack
    runs-on: ubuntu-24.04
    needs: [cooldown-check, build]
    steps:
      - name: Notify pre-deploy
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          webhook: ${{ secrets.PUBLISHING_NOTIFICATIONS_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Workflow: *${{ github.workflow }}*\n 📝 Deployment review requested for `edr-release`",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Workflow: *${{ github.workflow }}*\n 📝 Deployment review requested for `edr-release`"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Commit:* <${{ github.event.head_commit.url || format('{0}/{1}/commit/{2}', github.server_url, github.repository, github.sha) }}|View commit>\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open workflow run>"
                  }
                }
              ]
            }

  publish:
    name: Publish
    environment: edr-release
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # Needed for npm Trusted Publishing (OIDC)
    needs: [check_commit, notify-deploy, build]
    steps:
      - name: Notify deployment to Slack
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          webhook: ${{ secrets.PUBLISHING_NOTIFICATIONS_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Workflow: *${{ github.workflow }}*\n ✅ Deployment review approved \n 🚀 Starting deployment to `edr-release`",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Workflow: *${{ github.workflow }}*\n ✅ Deployment review approved \n 🚀 Starting deployment to `edr-release`"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Commit:* <${{ github.event.head_commit.url || format('{0}/{1}/commit/{2}', github.server_url, github.repository, github.sha) }}|View commit>\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open workflow run>"
                  }
                }
              ]
            }
      - name: Download packed tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.bundle-filename }}
          path: .
      - name: Decompress tarball
        env:
          FILENAME: ${{ needs.build.outputs.bundle-filename }}
        run: tar -xvzf "$FILENAME"
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - name: Setup node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        id: setup-node
        with:
          node-version: 24
          package-manager-cache: false
      - name: Update npm to make sure it supports Trusted Publishing
        run: npm install -g npm@v11.6.2 # zizmor: ignore[adhoc-packages] pinned npm required for Trusted Publishing support
      - name: Publish
        env:
          TAG: ${{ needs.check_commit.outputs.tag }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$TAG" = "next" ]
          then
            echo "Publishing pre-release"
          elif [ "$TAG" = "latest" ]
          then
            echo "Publishing release"
          else
            echo "Unrecognized tag $TAG. Skipping publish"
            exit 1
          fi

          FLAGS=(--no-git-checks --tag "$TAG" --access public)
          if [ "$DRY_RUN" = "true" ]
          then
            echo "Rehearsal run: publishing with --dry-run"
            FLAGS+=(--dry-run)
          fi

          # We need to publish the contests of crates/edr_napi only
          cd ./crates/edr_napi

          # First publish every cross-platform package
          for platform in ./npm/* ; do
            cd $platform
            pnpm publish "${FLAGS[@]}"
            cd -
          done
          # Finally Publish edr napi root package (because it depends on the cross-platform ones)
          pnpm publish "${FLAGS[@]}"
