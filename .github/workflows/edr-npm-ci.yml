# Thin PR/branch validation entry: runs the reusable build workflow
# (edr-npm-build.yml) in non-release mode — warm cargo caches, GHCR-mirrored
# images. Release pushes are skipped here; edr-npm-release.yml owns those.
name: EDR NPM CI
permissions: {}
on:
  push:
    # keep branches and paths in sync with edr-npm-release.yml
    branches:
      - main
      - prerelease
      - hh2
      - feat/solidity-tests
    tags-ignore:
      - "**"
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - "**/*.gitignore"
      - .editorconfig
      - docs/**
  pull_request: null
  workflow_dispatch:

jobs:
  check_commit:
    name: Check commit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.ref }}

      - id: check
        uses: ./.github/actions/check-release-commit

    outputs:
      is_release: ${{ steps.check.outputs.is-release }}

  build:
    name: Build and test
    needs: check_commit
    # The single condition in this workflow: release pushes are handled by
    # edr-npm-release.yml with a cold release-mode build instead.
    if: needs.check_commit.outputs.is_release != 'true'
    uses: ./.github/workflows/edr-npm-build.yml
    with:
      release: false
    permissions:
      contents: read
      packages: read
      actions: read # select-node-image lists mirror workflow runs
